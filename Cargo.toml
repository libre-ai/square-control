[workspace]
resolver = "2"
members = ["crates/layout", "crates/ffi", "tools/uniffi-bindgen"]

[workspace.package]
edition = "2021"
license = "EUPL-1.2"
publish = false
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
