version = 1
SPDX-PackageName = "square-control"
SPDX-PackageSupplier = "Libre AI <https://github.com/libre-ai>"
SPDX-PackageDownloadLocation = "https://github.com/libre-ai/square-control"

[[annotations]]
path = ["**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "EUPL-1.2"

# Editorial documentation and first-party project records (LICENSING.md, "Documentation").
# The probe protocol and the raw probe results are records of measurements, not executable specification.
[[annotations]]
path = ["README.md", "PROTOCOL.txt", "CONTRIBUTING.md", "SECURITY.md", "probes/results/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "CC-BY-4.0"
